version: '3.8'

services:
  # 1. The "Patient" app
  target-app:
    image: target-app:v1
    ports:
      - "8080:8080"
    networks:
      - sre-network

  # 2. The "Nervous System" (Redpanda)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-1
    command: >
      redpanda start
      --overprovisioned
      --smp 1
      --memory 1G
      --reserve-memory 0M
      --node-id 0
      --check=false
    ports:
      - "9092:9092"
      - "8081:8081"
    networks:
      - sre-network

  # 3. The "State Guard" (Redis for Idempotency)
  redis:
    image: redis:alpine
    container_name: redis-state
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sre-network

  # 4. The "Semantic Memory" (Qdrant for Deduplication)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-memory
    ports:
      - "6333:6333"
      - "6334:6334"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sre-network

networks:
  sre-network:
    driver: bridge