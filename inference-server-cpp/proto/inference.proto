syntax = "proto3";

package inference;

option go_package = "./proto";

message InferenceRequest {
  
  string log_line = 1;  
  string model_id = 2;
}

message InferenceResponse {
  repeated float embedding = 1;
     
  bool is_stale = 3; 

  float x = 4;
  float y = 5;
  float z = 6;     
}

service InferenceEngine {
  rpc RunInference (InferenceRequest) returns (InferenceResponse);
}