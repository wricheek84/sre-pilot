syntax = "proto3";

package inference;

option go_package = "./proto";

message InferenceRequest {
  
  string log_line = 1;  
  string model_id = 2;
}

message InferenceResponse {
  repeated int32 output_tokens = 1;
  float confidence = 2;   
  bool is_stale = 3;      
}

service InferenceEngine {
  rpc RunInference (InferenceRequest) returns (InferenceResponse);
}